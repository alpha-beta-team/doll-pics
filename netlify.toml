# Canonical host: www → apex (force so it runs before SPA rules)
[[redirects]]
  from = "https://www.dollpictures.in/*"
  to = "https://dollpictures.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.dollpictures.in/*"
  to = "https://dollpictures.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://dollpictures.in/*"
  to = "https://dollpictures.in/:splat"
  status = 301
  force = true

# Admin SPA: client routes need the app shell.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/employee"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/employee/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kiosk"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kiosk/*"
  to = "/index.html"
  status = 200

# Private customer quotations: SPA route with no caching, indexing or referrer leakage.
[[redirects]]
  from = "/quotation/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/employee/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/kiosk/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/quotation/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
